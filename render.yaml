services:
  - type: web
    name: bhavna-mirofish
    runtime: python
    plan: starter
    buildCommand: pip install uv && cd backend && uv sync --frozen
    startCommand: cd backend && FLASK_PORT=$PORT uv run python run.py
    healthCheckPath: /health
    envVars:
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://dashscope.aliyuncs.com/compatible-mode/v1
      - key: LLM_MODEL_NAME
        value: qwen-plus
      - key: ZEP_API_KEY
        sync: false
